<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goolets · Competitor Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--gold:#B39262;--gold-lt:#C9A876;--gold-dk:#9D7B4F;--cream:#FAF8F5;--cream-2:#F5F1EB;--sand:#E8DCC8;--ink:#121212;--ink-2:#2D2D2D;--muted:#6B6B6B;--alert:#B83C3C;
 --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--tb:66px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--gold-dk)}
[hidden]{display:none!important}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0;margin-right:6px;vertical-align:1px}
.lab{font:600 10.5px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--gold-dk)}
.mut{color:var(--muted)}
.np{display:inline-block;margin-left:8px;color:var(--alert);border:1px solid var(--alert);border-radius:999px;font:600 9.5px/1.6 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:0 6px;vertical-align:2px}
.pill{display:inline-block;background:var(--cream-2);border:1px solid var(--sand);color:var(--ink-2);border-radius:999px;font-size:11.5px;font-weight:500;line-height:1.6;padding:0 9px;white-space:nowrap}
.pill.hk,.hp .pill{background:var(--sand);border-color:var(--sand)}
.lnk{color:var(--gold-dk);font-weight:500;text-align:left}
.lnk:hover{color:var(--ink);text-decoration:underline}

/* Top bar */
.tb{position:sticky;top:0;z-index:20;height:var(--tb);background:var(--ink);color:var(--cream);border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:36px;padding:0 28px}
.tt{font:600 26px/1.1 var(--serif);color:#fff;white-space:nowrap;letter-spacing:.01em}
.ts{font-size:12px;color:var(--gold-lt);letter-spacing:.02em;white-space:nowrap;margin-top:3px}
.ptabs{display:flex;gap:2px;height:100%;align-items:stretch}
.ptab{display:flex;align-items:center;padding:0 14px;color:#d9d3c8;font-size:13.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px}
.ptab:hover{color:#fff}
.ptab.on{color:#fff;border-bottom-color:var(--gold-lt);background:rgba(255,255,255,.06)}
.ptab .dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.25)}
.pn{margin-left:7px;font-size:11.5px;color:var(--gold-lt);font-weight:600}
.vsw{margin-left:auto;display:flex;border:1px solid var(--gold);border-radius:4px;overflow:hidden;flex-shrink:0}
.vsw button{padding:6px 14px;font-size:12.5px;font-weight:500;color:var(--cream)}
.vsw button+button{border-left:1px solid var(--gold)}
.vsw button.on{background:var(--gold);color:var(--ink)}

/* Layout */
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);align-items:start}
.sb{position:sticky;top:var(--tb);height:calc(100vh - var(--tb));overflow-y:auto;background:var(--cream-2);border-right:1px solid var(--sand);padding:18px 12px 24px}
.sbh{font:600 20px/1.2 var(--serif);padding:0 8px 10px}
#cq{width:100%;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--sand);border-radius:4px;background:#fff;margin-bottom:10px}
#cq:focus,#fq:focus,.fs select:focus{outline:2px solid var(--gold-lt);outline-offset:0;border-color:var(--gold)}
.sbnote{display:none;font-size:12px;color:var(--muted);padding:0 8px 10px;line-height:1.4}
.sb.off .sbnote{display:block}
.sb.off #clist{opacity:.6}
.tierh{font:600 10.5px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--gold-dk);padding:14px 8px 5px}
.cr{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:4px;text-align:left;font-size:13px;color:var(--ink-2)}
.cr:hover{background:rgba(179,146,98,.12)}
.cr.on{background:var(--ink);color:#fff}
.cr.on .cc{color:#d9d3c8}
.cr.dim{opacity:.4}
.cr.all{font-weight:600}
.cnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--alert);margin-left:6px;vertical-align:2px}
.cc{display:flex;gap:8px;font-size:11.5px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.cpn{display:inline-flex;align-items:center}
.cpn .dot{width:6px;height:6px;margin-right:4px}
.cnone{font-size:12.5px;color:var(--muted);padding:6px 8px}
.mn{padding:22px 28px 40px;min-width:0}

/* Competitor header */
#chead{background:#fff;border:1px solid var(--sand);border-radius:6px;padding:18px 22px;margin-bottom:16px}
.chtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.chn{font:600 30px/1.1 var(--serif)}
.chp{font-size:12px;color:var(--muted);margin-top:4px}
.chr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px}
.tier{border:1px solid var(--gold);color:var(--gold-dk);border-radius:999px;font:600 11px/1.7 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:0 10px}
.chc{display:inline-flex;align-items:center;color:var(--ink-2)}
.chc b{margin-left:4px}
.chg{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--sand)}
.chf{min-width:0;font-size:13px}
.chf .lab{margin-bottom:6px}
.chf a{display:inline-block;margin:0 12px 4px 0;word-break:break-all}
.chf .hk{display:inline-block;background:var(--sand);border-radius:999px;padding:1px 10px;margin:0 6px 6px 0;font-size:12px}
.chf .hk b{color:var(--gold-dk);margin-left:2px}
.chf .lnk{color:var(--ink-2);font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chf .lnk b{color:var(--gold-dk);font-weight:600}

/* Filter row */
.fr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:0 0 14px;margin-bottom:18px;border-bottom:1px solid var(--sand)}
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.fl .lab,.fs .lab{margin-right:4px}
.hc{background:#fff;border:1px solid var(--sand);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2);line-height:1.6}
.hc:hover{border-color:var(--gold-lt)}
.hc.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.fs{display:flex;align-items:center}
.fs select,#fq{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--sand);border-radius:4px;background:#fff;color:var(--ink)}
#fq{width:200px}
.tog{border:1px solid var(--sand);background:#fff;border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:500;line-height:1.6}
.tog b{color:var(--alert);margin-left:3px}
.tog.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tog.on b{color:var(--gold-lt)}
.clr{color:var(--gold-dk);font-size:12.5px;text-decoration:underline}
#fcount{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (min-width:1500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cd{background:#fff;border:1px solid var(--sand);border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0}
.cd:hover,.cd:focus-visible{border-color:var(--gold-lt);box-shadow:0 6px 20px rgba(18,18,18,.08);transform:translateY(-1px);outline:0}
.cd.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-lt)}
.im{aspect-ratio:4/3;background:var(--cream-2);border-bottom:1px solid var(--sand);overflow:hidden;display:flex;align-items:center;justify-content:center}
.im img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.im.wide img{object-position:center}
.im.whole img{object-fit:contain;object-position:center}
.noimg{font-size:12px;color:var(--muted)}
.cb{padding:11px 14px 12px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.cm{font-size:11.5px;color:var(--muted);display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.cm .np{margin-left:auto}
.an{font:600 17px/1.2 var(--serif);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl{font-size:13px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hp{display:flex;gap:4px;flex-wrap:wrap}
.cf{margin-top:auto;padding-top:4px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}.stars .off{color:var(--sand)}
.empty{padding:50px 0;color:var(--muted);text-align:center}
.empty p{margin:0 0 8px}

/* By hook */
.hs{margin-bottom:28px}
.hh{font:600 24px/1.2 var(--serif);margin:0 0 10px}
.hh span{font:500 13px var(--sans);color:var(--muted)}
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:260px;gap:16px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.hrow .cd{scroll-snap-align:start}
.hrow::-webkit-scrollbar{height:8px}.hrow::-webkit-scrollbar-thumb{background:var(--sand);border-radius:4px}

/* Drawer */
#scrim{position:fixed;inset:0;background:rgba(18,18,18,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#dr{position:fixed;top:0;right:0;width:520px;max-width:100vw;height:100vh;background:#fff;border-left:1px solid var(--sand);box-shadow:-14px 0 40px rgba(18,18,18,.18);transform:translateX(102%);transition:transform .22s ease;z-index:40;overflow-y:auto;overscroll-behavior:contain}
.dopen #scrim{opacity:1;pointer-events:auto}
.dopen #dr{transform:none}
.dh{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--sand);display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 22px}
.dm{font-size:12px;color:var(--muted);display:flex;align-items:center}
.dn{display:flex;align-items:center;gap:4px}
.di{font-size:12px;color:var(--muted);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.ib{width:32px;height:32px;border-radius:4px;font-size:22px;line-height:1;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.ib:hover:not(:disabled){background:var(--cream-2)}
.ib:disabled{opacity:.3;cursor:default}
.ib.x{font-size:26px;margin-left:6px}
.db{padding:16px 22px 28px}
.da{font:600 28px/1.15 var(--serif)}
.ds{font-size:12.5px;color:var(--muted);margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--sand);border-radius:4px;overflow:hidden;margin-top:14px}
.seg button{padding:5px 16px;font-size:12.5px;font-weight:500;background:var(--cream-2);color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--sand)}
.seg button.on{background:var(--ink);color:#fff}
.dmed{margin-top:12px;border:1px solid var(--sand);border-radius:4px;overflow:hidden;background:var(--cream-2)}
.adimgs img{width:100%;display:block}
.adimgs a+a img{border-top:1px solid var(--sand)}
.pad{padding:20px}
.lpbox{height:60vh;overflow-y:auto;background:var(--cream-2)}
.lpbox img{width:100%;display:block}
.lpcap{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;font-size:12px;color:var(--muted);background:#fff;border-top:1px solid var(--sand)}
.lpcap span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpcap>a{white-space:nowrap;flex-shrink:0}
.db section{margin-top:20px}
.db h4{margin:0 0 8px;font:600 10.5px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--gold-dk)}
.words{background:var(--cream-2);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.wl{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
.wh{font-weight:600}
.wt{white-space:pre-wrap;font-size:13.5px}
.btn{display:inline-block;border:1px solid var(--sand);background:#fff;border-radius:4px;padding:2px 10px;font-size:13px;font-weight:500}
.why{border-left:2px solid var(--gold);padding-left:12px;font-size:13.5px;line-height:1.6}
.tr{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.tk{width:74px;flex-shrink:0;font-size:12px;color:var(--muted)}
.tv{display:flex;flex-wrap:wrap;gap:4px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.dt{display:flex;flex-direction:column;font-size:13px}
.dt span{font-size:11.5px;color:var(--muted)}
.dt b{font-weight:500}
.dlinks{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.gbtn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;border-radius:4px;padding:8px 16px;font-size:13px;font-weight:500}
.gbtn:hover{background:var(--ink-2)}
.gbtn.alt{background:#fff;color:var(--ink);border:1px solid var(--gold)}
.gbtn.alt:hover{background:var(--cream-2)}

footer{padding:24px 20px 40px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--sand);text-align:center;background:var(--cream)}
footer a{color:var(--gold-dk);margin:0 8px;white-space:nowrap}

@media (max-width:900px){
 .tb{height:auto;flex-wrap:wrap;gap:8px 16px;padding:10px 16px;position:static}
 .ptabs{height:36px}
 .wrap{grid-template-columns:1fr}
 .sb{position:static;height:auto;max-height:260px;border-right:0;border-bottom:1px solid var(--sand)}
 .mn{padding:16px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .chg{grid-template-columns:1fr}
}
@media (max-width:560px){.grid{grid-template-columns:1fr}#fq{width:100%}}
</style></head><body>
<header class="tb"><div class="tbl"><div class="tt">Goolets · Competitor Ads</div><div class="ts">updated 9 Oct 2026 · 40 ads · 19 advertisers</div></div><nav class="ptabs" id="ptabs" aria-label="Platform"></nav><div class="vsw" id="vsw"><button data-view="comp">By competitor</button><button data-view="hook">By hook</button></div></header>
<div class="wrap"><aside class="sb" id="sb"><div class="sbh">Competitors</div><input id="cq" type="search" placeholder="Find a competitor" autocomplete="off"><div class="sbnote">By hook shows every competitor. Pick one to switch back to By competitor.</div><div id="clist"></div></aside>
<main class="mn"><div id="chead" hidden></div><div class="fr" id="fr"><div class="fl"><span class="lab">Hook</span><span class="fl" id="hchips"></span></div><label class="fs"><span class="lab">Format</span><select id="ffmt"></select></label><label class="fs"><span class="lab">Offer</span><select id="foff"></select></label><button class="tog" id="fnew"></button><label class="fs"><span class="lab">Sort</span><select id="fsort"></select></label><input id="fq" type="search" placeholder="Search all ad text" autocomplete="off"><button class="clr" id="fclr" hidden>Clear</button><span id="fcount"></span></div><div id="res"></div></main></div>
<footer>Built by Dejan Smodiš · data from public ad libraries (Meta, Google, TikTok)<br>
 <a href="https://www.facebook.com/ads/library/" target="_blank" rel="noopener">Meta</a>
 <a href="https://adstransparency.google.com/" target="_blank" rel="noopener">Google and YouTube</a>
 <a href="https://www.linkedin.com/ad-library/" target="_blank" rel="noopener">LinkedIn</a>
 <a href="https://library.tiktok.com/ads" target="_blank" rel="noopener">TikTok</a></footer>
<div id="scrim"></div><aside id="dr" aria-hidden="true" aria-label="Ad details"></aside>
<script>
(function gooletsClient(D) {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const safe = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
  const short = u => String(u || '').replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const WEEK = 7 * 864e5;
  const isNew = a => { if (!a.savedAt) return false; const t = new Date(String(a.savedAt).replace(' ', 'T')).getTime(); return !isNaN(t) && Date.now() - t < WEEK; };
  const fmtDate = s => { if (!s) return ''; const d = new Date(String(s).replace(' ', 'T').slice(0, 10) + 'T00:00:00'); return isNaN(d) ? String(s) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
  const plat = p => D.platforms[p] || { label: p, colour: '#6B6B66' };
  const dot = p => '<i class="dot" style="--c:' + esc(plat(p).colour) + '"></i>';
  const src = (a, f) => 'ads/' + encodeURIComponent(a.id) + '/' + encodeURIComponent(f);
  // Last shown in the past two weeks still counts as running (Google reports yesterday's date).
  const stillOn = a => { if (!a.lastShown) return true; const t = new Date(String(a.lastShown).slice(0, 10) + 'T00:00:00').getTime(); return !isNaN(t) && Date.now() - t < 14 * 864e5; };
  const runText = a => a.daysRunning == null ? '' : (stillOn(a) ? 'Running ' : 'Ran ') + plural(a.daysRunning, 'day');
  const lineOf = a => a.headline || (a.primaryText ? (a.primaryText.length > 90 ? a.primaryText.slice(0, 90).replace(/\s+\S*$/, '') + '...' : a.primaryText) : '');
  const byId = Object.fromEntries(D.ads.map(a => [a.id, a]));
  const comp = Object.fromEntries(D.comps.map(c => [c.key, c]));
  D.ads.forEach(a => { a._s = [a.advertiser, a.competitorPageName, a.headline, a.primaryText, a.description, a.cta, a.displayUrl, a.landingFinalUrl, (a.landingPages || []).join(' '), (a.hooks || []).join(' '), a.offer, (a.styles || []).join(' '), a.objective, a.industry, a.whyItWorks, a.format, plat(a.platform).label].filter(Boolean).join(' ').toLowerCase(); });
  const SORTS = { days: 'Longest running', started: 'Newest ads', saved: 'Newest saved', rating: 'Rating' };

  // State, remembered in this browser only.
  const KEY = 'goolets-competitor-ads';
  const S = { plat: 'all', view: 'comp', comp: null, hooks: [], format: '', offer: '', fresh: false, sort: 'days', q: '' };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (s.plat === 'all' || D.platOrder.includes(s.plat)) S.plat = s.plat;
    if (s.view === 'comp' || s.view === 'hook') S.view = s.view;
    if (comp[s.comp]) S.comp = s.comp;
    if (Array.isArray(s.hooks)) S.hooks = s.hooks.filter(h => D.hooks.includes(h));
    if (D.formats.includes(s.format)) S.format = s.format;
    if (D.offers.includes(s.offer)) S.offer = s.offer;
    S.fresh = s.fresh === true;
    if (SORTS[s.sort]) S.sort = s.sort;
    if (typeof s.q === 'string') S.q = s.q;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  function filtered() {
    const q = S.q.trim().toLowerCase();
    return D.ads.filter(a => (S.plat === 'all' || a.platform === S.plat)
      && (!S.hooks.length || (a.hooks || []).some(h => S.hooks.includes(h)))
      && (!S.format || a.format === S.format) && (!S.offer || a.offer === S.offer)
      && (!S.fresh || isNew(a)) && (!q || q.split(/\s+/).every(w => a._s.includes(w))));
  }
  function sorted(list) {
    const l = list.slice();
    const str = (a, k) => String(a[k] || '');
    if (S.sort === 'days') l.sort((a, b) => (b.daysRunning ?? -1) - (a.daysRunning ?? -1) || str(b, 'savedAt').localeCompare(str(a, 'savedAt')));
    if (S.sort === 'started') l.sort((a, b) => (b.startedRunning ? 1 : 0) - (a.startedRunning ? 1 : 0) || str(b, 'startedRunning').localeCompare(str(a, 'startedRunning')));
    if (S.sort === 'saved') l.sort((a, b) => str(b, 'savedAt').localeCompare(str(a, 'savedAt')) || b.id.localeCompare(a.id));
    if (S.sort === 'rating') l.sort((a, b) => (+b.rating || 0) - (+a.rating || 0) || (b.daysRunning ?? -1) - (a.daysRunning ?? -1));
    return l;
  }

  // Top bar: platform tabs and the view switch.
  function renderTop() {
